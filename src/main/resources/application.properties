# ------------------------------------------------------------
# Course Registration Portal - application settings
# ------------------------------------------------------------
spring.application.name=workshop-app
app.version=1.0.0

# The app listens on port 8081 (open this port in the AWS security group)
server.port=8081

# In-memory H2 database (tables created from schema.sql, sample data from data.sql)

# Only expose the health and info actuator endpoints over HTTP
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Certificate storage (AWS S3) used to upload course-completion certificates
# TODO: move these credentials somewhere safer before going live
app.certificates.bucket=workshop-certificates
